<div class="stat-card">
  <div class="stat-content">
    <p class="stat-title">{{ title }}</p>
    <h2>{{ value }}</h2>

    <span
      class="stat-change"
      [class.positive]="trend === 'up'"
      [class.negative]="trend === 'down'"
    >
      {{ change }}
    </span>
  </div>

  <div class="stat-icon">
    {{ icon }}
  </div>
</div>
