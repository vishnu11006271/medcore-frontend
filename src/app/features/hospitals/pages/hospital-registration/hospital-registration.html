<div class="registration-container">
  <div class="registration-card">
    <div class="header">
      <h2>Register Your Hospital</h2>
      <p>Submit your hospital details and create the initial hospital administrator account.</p>
    </div>

    <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" novalidate>
      <h3>Hospital Information</h3>

      <app-form-field
        class="form-group"
        inputId="hospitalName"
        label="Hospital Name"
        [required]="true"
        [error]="getFieldError(controls.hospitalName)">
        <input
          id="hospitalName"
          type="text"
          formControlName="hospitalName"
          placeholder="Enter hospital name"
          (blur)="generateSlug()"
          [attr.aria-invalid]="controls.hospitalName.touched && controls.hospitalName.invalid"
          [attr.aria-describedby]="controls.hospitalName.touched && controls.hospitalName.invalid ? 'hospitalName-error' : null"
        />
      </app-form-field>

      <app-form-field
        class="form-group"
        inputId="slug"
        label="Hospital URL Slug"
        [required]="true"
        hint="Use lowercase letters, numbers and hyphens."
        [error]="getFieldError(controls.slug)">
        <input
          id="slug"
          type="text"
          formControlName="slug"
          placeholder="example-city-hospital"
          [attr.aria-invalid]="controls.slug.touched && controls.slug.invalid"
          [attr.aria-describedby]="controls.slug.touched && controls.slug.invalid ? 'slug-hint slug-error' : 'slug-hint'"
        />
      </app-form-field>

      <app-form-field
        class="form-group"
        inputId="hospitalEmail"
        label="Hospital Email"
        [required]="true"
        [error]="getFieldError(controls.hospitalEmail)">
        <input
          id="hospitalEmail"
          type="email"
          formControlName="hospitalEmail"
          placeholder="contact@hospital.com"
          [attr.aria-invalid]="controls.hospitalEmail.touched && controls.hospitalEmail.invalid"
          [attr.aria-describedby]="controls.hospitalEmail.touched && controls.hospitalEmail.invalid ? 'hospitalEmail-error' : null"
        />
      </app-form-field>

      <app-form-field class="form-group" inputId="registrationNumber" label="Registration Number">
        <input id="registrationNumber" type="text" formControlName="registrationNumber" placeholder="Enter registration number" />
      </app-form-field>

      <app-form-field class="form-group" inputId="hospitalPhone" label="Hospital Phone">
        <input id="hospitalPhone" type="tel" formControlName="hospitalPhone" placeholder="Enter hospital phone" />
      </app-form-field>

      <app-form-field
        class="form-group"
        inputId="address"
        label="Hospital Address"
        [required]="true"
        [error]="getFieldError(controls.address)">
        <textarea
          id="address"
          rows="3"
          formControlName="address"
          placeholder="Enter complete hospital address"
          [attr.aria-invalid]="controls.address.touched && controls.address.invalid"
          [attr.aria-describedby]="controls.address.touched && controls.address.invalid ? 'address-error' : null">
        </textarea>
      </app-form-field>

      <hr />

      <h3>Initial Administrator Details</h3>

      <app-form-field
        class="form-group"
        inputId="adminFirstName"
        label="First Name"
        [required]="true"
        [error]="getFieldError(controls.adminFirstName)">
        <input
          id="adminFirstName"
          type="text"
          formControlName="adminFirstName"
          placeholder="Enter first name"
          [attr.aria-invalid]="controls.adminFirstName.touched && controls.adminFirstName.invalid"
          [attr.aria-describedby]="controls.adminFirstName.touched && controls.adminFirstName.invalid ? 'adminFirstName-error' : null"
        />
      </app-form-field>

      <app-form-field
        class="form-group"
        inputId="adminLastName"
        label="Last Name"
        [required]="true"
        [error]="getFieldError(controls.adminLastName)">
        <input
          id="adminLastName"
          type="text"
          formControlName="adminLastName"
          placeholder="Enter last name"
          [attr.aria-invalid]="controls.adminLastName.touched && controls.adminLastName.invalid"
          [attr.aria-describedby]="controls.adminLastName.touched && controls.adminLastName.invalid ? 'adminLastName-error' : null"
        />
      </app-form-field>

      <app-form-field
        class="form-group"
        inputId="adminEmail"
        label="Administrator Email"
        [required]="true"
        [error]="getFieldError(controls.adminEmail)">
        <input
          id="adminEmail"
          type="email"
          formControlName="adminEmail"
          placeholder="admin@hospital.com"
          [attr.aria-invalid]="controls.adminEmail.touched && controls.adminEmail.invalid"
          [attr.aria-describedby]="controls.adminEmail.touched && controls.adminEmail.invalid ? 'adminEmail-error' : null"
        />
      </app-form-field>

      <app-form-field class="form-group" inputId="adminPhone" label="Administrator Phone">
        <input id="adminPhone" type="tel" formControlName="adminPhone" placeholder="Enter administrator phone" />
      </app-form-field>

      <app-form-field
        class="form-group"
        inputId="password"
        label="Password"
        [required]="true"
        hint="Password must contain between 12 and 128 characters."
        [error]="getFieldError(controls.password)">
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Create a password"
          autocomplete="new-password"
          [attr.aria-invalid]="controls.password.touched && controls.password.invalid"
          [attr.aria-describedby]="controls.password.touched && controls.password.invalid ? 'password-hint password-error' : 'password-hint'"
        />
      </app-form-field>

      <div class="error-message" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage" role="status">
        {{ successMessage }}
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Submitting...' : 'Register Hospital' }}
      </button>
    </form>

    <div class="login-link">
      Already registered?
      <button type="button" (click)="goToLogin()">Login</button>
    </div>
  </div>
</div>
