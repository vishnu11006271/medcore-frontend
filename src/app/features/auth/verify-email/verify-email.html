<div class="verify-container">
  <div class="verify-card">

    <div class="verify-icon">
      <span>✉</span>
    </div>

    <h2>Verify Your Email</h2>

    <p class="subtitle">
      Enter the email address and six-digit OTP sent to your inbox.
    </p>

    <form
      [formGroup]="verifyForm"
      (ngSubmit)="onSubmit()"
    >

      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          autocomplete="email"
        />

        <small
          class="field-error"
          *ngIf="email.touched && email.hasError('required')"
        >
          Email is required.
        </small>

        <small
          class="field-error"
          *ngIf="email.touched && email.hasError('email')"
        >
          Please enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="otp">Verification OTP</label>

        <input
          id="otp"
          type="text"
          formControlName="otp"
          placeholder="Enter 6-digit OTP"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
        />

        <small
          class="field-error"
          *ngIf="otp.touched && otp.hasError('required')"
        >
          OTP is required.
        </small>

        <small
          class="field-error"
          *ngIf="otp.touched && otp.hasError('pattern')"
        >
          Please enter a valid six-digit OTP.
        </small>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button
        type="submit"
        [disabled]="isLoading || isResending"
      >
        {{ isLoading ? 'Verifying...' : 'Verify Email' }}
      </button>

    </form>

    <div class="resend-section">

      <p>Didn't receive the verification email?</p>

      <button
        type="button"
        class="resend-button"
        (click)="resendOtp()"
        [disabled]="isResending || resendCountdown > 0"
      >
        <ng-container *ngIf="isResending">
          Sending...
        </ng-container>

        <ng-container *ngIf="!isResending && resendCountdown > 0">
          Resend OTP in {{ resendCountdown }}s
        </ng-container>

        <ng-container *ngIf="!isResending && resendCountdown === 0">
          Resend OTP
        </ng-container>
      </button>

      <small class="resend-message" *ngIf="resendMessage">
        {{ resendMessage }}
      </small>

    </div>

    <div class="back-link">
      <button type="button" (click)="goToLogin()">
        Back to Login
      </button>
    </div>

  </div>
</div>
