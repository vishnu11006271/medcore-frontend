<main class="register-page">
  <section class="register-card">
    <a class="brand" routerLink="/login">Medcore HMS</a>
    <h1>Create your patient account</h1>
    <p class="subtitle">Register once and connect with a hospital when you book your first appointment.</p>

    <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-row">
        <app-form-field
          inputId="firstName"
          label="First name"
          [required]="true"
          [error]="getFieldError(controls.firstName)">
          <input
            id="firstName"
            type="text"
            formControlName="firstName"
            autocomplete="given-name"
            [attr.aria-invalid]="controls.firstName.touched && controls.firstName.invalid"
            [attr.aria-describedby]="controls.firstName.touched && controls.firstName.invalid ? 'firstName-error' : null"
          />
        </app-form-field>

        <app-form-field
          inputId="lastName"
          label="Last name"
          [required]="true"
          [error]="getFieldError(controls.lastName)">
          <input
            id="lastName"
            type="text"
            formControlName="lastName"
            autocomplete="family-name"
            [attr.aria-invalid]="controls.lastName.touched && controls.lastName.invalid"
            [attr.aria-describedby]="controls.lastName.touched && controls.lastName.invalid ? 'lastName-error' : null"
          />
        </app-form-field>
      </div>

      <app-form-field
        inputId="email"
        label="Email address"
        [required]="true"
        [error]="getFieldError(controls.email)">
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="controls.email.touched && controls.email.invalid"
          [attr.aria-describedby]="controls.email.touched && controls.email.invalid ? 'email-error' : null"
        />
      </app-form-field>

      <app-form-field
        inputId="password"
        label="Password"
        [required]="true"
        hint="Use a password between 12 and 128 characters."
        [error]="getFieldError(controls.password)">
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="controls.password.touched && controls.password.invalid"
          [attr.aria-describedby]="controls.password.touched && controls.password.invalid ? 'password-error password-hint' : 'password-hint'"
        />
      </app-form-field>

      <p class="error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating account…' : 'Create patient account' }}
      </button>
    </form>

    <p class="footer">Already registered? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
