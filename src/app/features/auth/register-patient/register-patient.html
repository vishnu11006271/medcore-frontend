<main class="register-page">
  <section class="register-card">
    <a class="brand" routerLink="/login">Medcore HMS</a>
    <h1>Create your patient account</h1>
    <p class="subtitle">Register once and connect with a hospital when you book your first appointment.</p>

    <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-row">
        <label>First name
          <input type="text" formControlName="firstName" autocomplete="given-name" />
          <small *ngIf="controls.firstName.touched && controls.firstName.invalid">Enter a first name (at least 2 characters).</small>
        </label>
        <label>Last name
          <input type="text" formControlName="lastName" autocomplete="family-name" />
          <small *ngIf="controls.lastName.touched && controls.lastName.invalid">Enter a last name (at least 2 characters).</small>
        </label>
      </div>

      <label>Email address
        <input type="email" formControlName="email" autocomplete="email" />
        <small *ngIf="controls.email.touched && controls.email.invalid">Enter a valid email address.</small>
      </label>

      <label>Password
        <input type="password" formControlName="password" autocomplete="new-password" />
        <small *ngIf="controls.password.touched && controls.password.invalid">Use a password between 12 and 128 characters.</small>
      </label>

      <p class="error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating account…' : 'Create patient account' }}
      </button>
    </form>

    <p class="footer">Already registered? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
